<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 2rem;
            background-color: #f8f9fa;
        }
        .table td, .table th {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">Employee Management</h2>

<form id="employeeForm" class="row g-3">
    <input type="hidden" id="employeeId">

    <div class="col-md-3">
        <input type="text" class="form-control" id="name" placeholder="First Name" required>
    </div>

    <div class="col-md-3">
        <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
    </div>

    <div class="col-md-3">
        <input type="email" class="form-control" id="email" placeholder="Email" required>
    </div>

    <div class="col-md-3">
        <select class="form-select" id="role" required>
            <option selected disabled value="">Choose Role...</option>
            <option value="MANAGER">Manager</option>
            <option value="STAFF">Staff</option>
        </select>
    </div>

    <div class="col-md-4">
        <input type="text" class="form-control" id="address" placeholder="Address">
    </div>

    <div class="col-md-4">
        <input type="tel" class="form-control" id="phone" placeholder="Phone Number">
    </div>

    <div class="col-md-3">
        <input type="text" class="form-control" id="ssn" placeholder="SSN">
    </div>

    <div class="col-md-1 d-flex gap-1">
        <button type="submit" class="btn btn-primary w-100" id="submitButton">Add</button>
        <button type="button" class="btn btn-secondary w-100 d-none" id="cancelButton">Cancel</button>
    </div>
</form>

        <table class="table table-striped mt-4">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Phone Number</th>
                    <th>Address</th>
                    <th>SSN</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <!-- Rows will be inserted here -->
            </tbody>
        </table>
    </div>
<script src="js/employee.js"></script>
</body>
</html>
